services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: aquavibe_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquavibe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquavibe_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aquavibe_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquavibe} -d ${POSTGRES_DB:-aquavibe_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aquavibe_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquavibe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquavibe_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aquavibe_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-aquavibe}:${POSTGRES_PASSWORD:-aquavibe_secret}@db:5432/${POSTGRES_DB:-aquavibe_db}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. React Native Web Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aquavibe_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data:
